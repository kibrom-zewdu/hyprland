# =============================================
# MY HYPRLAND CONFIG - Ubuntu 26.04
# Git: https://github.com/kb-z21/hyprland
# =============================================

source = ~/.config/hypr/colors.conf

################
### MONITORS ###
################
monitor = , preferred, auto, 1

###################
### MY PROGRAMS ###
###################
$terminal    = kitty
$fileManager = dolphin
$menu        = rofi -show drun
$browser     = firefox

#################
### AUTOSTART ###
#################
exec-once = waybar &
exec-once = hyprpaper &
exec-once = dunst &
exec-once = nm-applet --indicator &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in     = 5
    gaps_out    = 15
    border_size = 2

    col.active_border   = $blue $mauve 45deg
    col.inactive_border = $surface1

    resize_on_border = false
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = 10
    rounding_power = 2

    active_opacity     = 0.95
    inactive_opacity   = 0.85
    fullscreen_opacity = 1.0

    shadow {
        enabled      = true
        range        = 8
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled           = true
        size              = 6
        passes            = 3
        new_optimizations = on
        ignore_opacity    = true
        noise             = 0.02
        contrast          = 1.0
        brightness        = 1.0
        vibrancy          = 0.1696
        popups            = true
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile      = true
    preserve_split  = true
}

master {
    new_status = master
    mfact      = 0.5
}

misc {
    force_default_wallpaper    = 0
    disable_autoreload         = false
    disable_hyprland_logo      = true
    focus_on_activate          = true
    animate_manual_resizes     = false
    animate_mouse_windowdragging = false
    enable_swallow             = false
}

#############
### INPUT ###
#############
input {
    kb_layout     = us
    follow_mouse  = 1
    sensitivity   = 0
    accel_profile = flat
    numlock_by_default = true

    touchpad {
        natural_scroll        = false
        disable_while_typing  = true
        clickfinger_behavior  = true
        scroll_factor         = 1.0
    }
}

gesture = 3, horizontal, workspace
gesture = 3, up,         fullscreen
gesture = 3, down,       close

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# --- Apps ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q,      killactive,
bind = $mainMod, M,      exit,
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser
bind = $mainMod, D,      exec, $menu
bind = $mainMod, SPACE,  exec, $menu
bind = $mainMod, T,      exec, kitty --title "htop" htop
bind = $mainMod, L,      exec, hyprlock

# --- Window controls ---
bind = $mainMod, F, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, Z, fullscreen,
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, TAB, cyclenext

# --- Move focus (arrows) ---
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# --- Move focus (vim keys) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# --- Move windows ---
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# --- Resize windows ---
bind = $mainMod CTRL, left,  resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive,  20 0
bind = $mainMod CTRL, up,    resizeactive,  0 -20
bind = $mainMod CTRL, down,  resizeactive,  0  20

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Scratchpad ---
bind = $mainMod, S,       togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,       special:magic

# --- Scroll workspaces ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# --- Mouse bindings ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Screenshots ---
bind = ,      Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod, PRINT, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# --- Media keys ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,  exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

##############################
### WINDOW RULES           ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus = true
}

windowrule {
    name = float-dialogs
    match:class = (xdg-desktop-portal-gtk|org.kde.dolphin|firefox)
    match:title = (Open|Save|Choose|Preferences|Settings|Properties|Confirm|Alert)
    float  = yes
    center = yes
}

windowrule {
    name = float-file-pickers
    match:class = (xdg-desktop-portal-gtk|xdg-desktop-portal-kde)
    float  = yes
    center = yes
    size   = 800 600
}

windowrule {
    name = pip
    match:title = (Picture-in-Picture|PiP)
    float = yes
    pin   = yes
    size  = 480 270
    move  = 100%-500 50
}

# App-specific transparency
windowrulev2 = opacity 0.95 0.85, class:^(kitty)$
windowrulev2 = opacity 0.95 0.85, class:^(Alacritty)$
windowrulev2 = opacity 0.95 0.85, class:^(firefox)$
windowrulev2 = opacity 0.95 0.85, class:^(dolphin)$
windowrulev2 = opacity 0.95 0.85, class:^(code)$

# Full opacity for media apps
windowrulev2 = opacity 1.0 1.0, class:^(mpv)$
windowrulev2 = opacity 1.0 1.0, class:^(vlc)$
windowrulev2 = opacity 1.0 1.0, class:^(gimp)$

# No blur for videos
windowrulev2 = noblur, class:^(mpv)$
windowrulev2 = noblur, class:^(vlc)$
